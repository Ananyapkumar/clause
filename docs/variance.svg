<rect x="732" y="120" width="196" height="347" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="746" y="146" font-size="12.5" font-weight="700" fill="#1a1a1a">THE FINDING</text>
<text x="746" y="168" font-size="11.5" font-weight="400" fill="#6b7280">Transcription fields are</text>
<text x="746" y="185" font-size="11.5" font-weight="400" fill="#6b7280">deterministic. Judgement</text>
<text x="746" y="202" font-size="11.5" font-weight="400" fill="#6b7280">fields are not.</text>
<text x="746" y="227" font-size="12.5" font-weight="600" fill="#1a1a1a">Noise floor: 1 field</text>
<text x="746" y="244" font-size="11.5" font-weight="400" fill="#6b7280">per document, measured</text>
<text x="746" y="261" font-size="11.5" font-weight="400" fill="#6b7280">independently on two</text>
<text x="746" y="278" font-size="11.5" font-weight="400" fill="#6b7280">documents.</text>
<text x="746" y="303" font-size="11.5" font-weight="400" fill="#6b7280">So a one-field difference</text>
<text x="746" y="320" font-size="11.5" font-weight="400" fill="#6b7280">between versions cannot</text>
<text x="746" y="336" font-size="11.5" font-weight="400" fill="#6b7280">be told from noise — and</text>
<text x="746" y="352" font-size="11.5" font-weight="400" fill="#6b7280">that is exactly the size</text>
<text x="746" y="369" font-size="11.5" font-weight="400" fill="#6b7280">of the v0 vs v2 gap this</text>
<text x="746" y="386" font-size="11.5" font-weight="400" fill="#6b7280">project set out to read.</text>
<text x="746" y="411" font-size="11" font-weight="400" fill="#6b7280">Not every judgement field</text>
<text x="746" y="426" font-size="11" font-weight="400" fill="#6b7280">was stressed by these two</text>
<text x="746" y="441" font-size="11" font-weight="400" fill="#6b7280">documents — red marks the</text>
<text x="746" y="456" font-size="11" font-weight="400" fill="#6b7280">category, not the result.</text>
<text x="732" y="497" font-size="12.5" font-weight="600" fill="#1a1a1a">Scores observed</text>
<text x="732" y="517" font-size="11.5" fill="#6b7280">8–9 of 9, n=13 runs</text>
<text x="732" y="535" font-size="11.5" fill="#6b7280">spread = 1 field</text>
<rect x="32" y="643" width="11" height="11" rx="2" fill="#3b82f6" opacity="0.5"/>
<text x="49" y="653" font-size="12" fill="#6b7280">transcription</text>
<rect x="172" y="643" width="11" height="11" rx="2" fill="#dc2626" opacity="0.95"/>
<text x="189" y="653" font-size="12" fill="#6b7280">domain judgement</text>
<text x="908" y="653" font-size="11" fill="#6b7280" text-anchor="end">generated by make_figures.py from results/variance-*.json</text>
<text x="32" y="675" font-size="11" fill="#6b7280">Field categories declared in the script ahead of the data, so the boundary was not drawn around whatever turned out to be unstable.</text>
</svg>